# This file generates the GitHub Actions matrix.
# Left = central (USB HID to the host). Right = peripheral (carries the sensor).
# nRF52840 "Pro Micro"/SuperMini clones are drop-in compatible with nice!nano v2,
# so we build against nice_nano_v2 -- confirm your clone's bootloader accepts a
# nice_nano_v2 UF2 before relying on it.
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  # Flash to wipe BLE bonds when re-pairing the halves or the host.
  - board: nice_nano_v2
    shield: settings_reset
