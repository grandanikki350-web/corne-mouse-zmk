# Shared Kconfig for BOTH halves (central + peripheral).

# --- Pointing / mouse ------------------------------------------------------
# Enables the pointing stack (mouse buttons &mkp, scroll &msc) and the input
# subsystem plumbing that carries pointer motion from the peripheral half.
CONFIG_ZMK_POINTING=y

# Report the pointer to the host at 60 Hz (ZMK default is lower). Tune to taste.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- Split (BLE between halves) --------------------------------------------
# Both halves are USB-powered (no battery). Data still crosses over BLE:
# the left half is central and speaks USB HID to the PC; the right half is a
# peripheral and forwards keys + pointer motion over BLE.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Since both halves sit on USB power permanently, keep BLE at full tilt.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Optional niceties (uncomment if wanted) -------------------------------
# CONFIG_ZMK_SLEEP=n            # no battery to save; never deep-sleep
# CONFIG_ZMK_IDLE_TIMEOUT=600000
