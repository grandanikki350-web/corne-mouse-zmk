# Kconfig applied ONLY to the right half (the peripheral that carries the sensor).
# ZMK auto-loads "<shield>.conf", and the right build's shield is `corne_right`.

# The PMW3360 hangs off SPI, so the SPI peripheral must be compiled in on this
# half only (the left half has no sensor and leaves SPI off).
CONFIG_SPI=y

# PMW3360 driver threading (george-norton/zmk-driver-pmw3360 defaults shown).
# A dedicated thread keeps pointer polling responsive.
CONFIG_INPUT_PIXART_PMW3360_USE_OWN_THREAD=y
# CONFIG_INPUT_PIXART_PMW3360_THREAD_PRIORITY=5
# CONFIG_INPUT_PIXART_PMW3360_THREAD_STACK_SIZE=768
